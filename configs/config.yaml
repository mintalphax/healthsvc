# HealthSvc configuration (Windows / macOS)
# Windows: registers as a system service. macOS: registers as a LaunchDaemon.
# Changes hot-reload within 10 seconds - no restart needed.

service:
  # Windows service name (this section is ignored on macOS)
  name: "KeepHealthService"
  display_name: "System Health Service"
  description: "System Health Service keeps the system running."

schedule:
  # Lock times (24-hour HH:MM). The screen locks at each time on matching days.
  lock_times:
    - "23:10"

  # Days of the week to arm the schedule.
  # Leave empty (or use "*") for every day.
  weekdays:
  #  - "Monday"
  #  - "Tuesday"
  #  - "Wednesday"
  #  - "Thursday"
  #  - "Friday"

  # Optional: pin the timezone used to interpret lock_times and weekdays
  # (IANA name). When set, changing the machine's system timezone has no
  # effect on the schedule. Leave empty to follow the system timezone.
  #
  # Common zone names (any IANA zone works; run "healthsvc -check" to verify):
  #   Asia/Shanghai   Asia/Hong_Kong   Asia/Taipei   Asia/Singapore
  #   Asia/Tokyo      Asia/Seoul       UTC           Europe/London
  #   Europe/Berlin   Europe/Paris     America/New_York  America/Chicago
  #   America/Denver  America/Los_Angeles  America/Vancouver  Australia/Sydney
  #
  # A misspelled zone is rejected at load time: the daemon keeps running with
  # the previous config (see the log) and the lock schedule is unchanged.
  # timezone: "Asia/Shanghai"

  # Master switch
  enable: true

  # Seconds between schedule checks
  check_interval: 30

ntp:
  # NTP servers queried in order (empty = use built-in defaults below)
  servers:
    - "pool.ntp.org"
    - "time.apple.com"
    - "time.windows.com"
    - "time.google.com"
    - "cn.pool.ntp.org"

  # Max retries when acquiring network time
  max_retries: 3

  # Seconds between retries
  retry_interval: 5

  # Fall back to the local clock when all NTP servers fail.
  # Not recommended (a tampered clock defeats the schedule).
  allow_local_time: true

  # Warn when the local clock differs from NTP by more than this many seconds.
  # 0 disables the check.
  max_time_offset: 300
